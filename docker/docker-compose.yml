name: proyecto-b-chatbot

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-chatbot
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - chatbot_net

  postgres:
    image: postgres:15-alpine
    container_name: postgres-chatbot
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-chatbot_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatbot_pass}
      - POSTGRES_DB=${POSTGRES_DB:-chatbot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - chatbot_net

volumes:
  n8n_data:
  postgres_data:

networks:
  chatbot_net:
    driver: bridge
